<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campus Stores · Media equipment desk</title>
    <meta
      name="description"
      content="Work a shift at a fictional campus equipment desk in this interactive product engineering exercise."
    />
    <script>
      // Light mode by default; the header toggle still switches and remembers the choice.
      try { if (!localStorage.getItem("ion:mode")) localStorage.setItem("ion:mode", "light"); } catch (e) {}
    </script>
    <script src="./ion/ion-mode.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@100..900&display=swap"
    />
    <link rel="stylesheet" href="./ion/ion.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="campus-stores" class="ion-shell" data-sidebar-shell>
      <aside class="ion-sidebar" data-sidebar aria-label="Campus Stores">
        <div class="ion-sidebar__panel">
          <div class="ion-sidebar__header">
            <div class="ion-sidebar__brand">
              <span class="ion-sidebar__logo"><i data-lucide="package-open"></i></span>
              <span class="ion-sidebar__brand-name">Campus Stores</span>
              <button class="ion-sidebar__close" type="button" data-sidebar-close aria-label="Close sidebar"><i data-lucide="x"></i></button>
            </div>
          </div>
          <nav class="ion-sidebar__content" aria-label="Store records">
            <div class="ion-sidebar__group">
              <div class="ion-sidebar__group-label">Media equipment desk</div>
              <ul class="ion-sidebar__menu">
                <li><button class="ion-sidebar__item" type="button" data-tab="Today"><span class="ion-sidebar__icon"><i data-lucide="layout-dashboard"></i></span><span class="ion-sidebar__label">Today</span><span class="ion-sidebar__badge" data-out-count title="Items out"></span></button></li>
                <li><button class="ion-sidebar__item" type="button" data-tab="Requests"><span class="ion-sidebar__icon"><i data-lucide="clipboard-list"></i></span><span class="ion-sidebar__label">Requests</span></button></li>
                <li><button class="ion-sidebar__item" type="button" data-tab="Returns"><span class="ion-sidebar__icon"><i data-lucide="scan-barcode"></i></span><span class="ion-sidebar__label">Returns</span></button></li>
                <li><button class="ion-sidebar__item" type="button" data-tab="Inventory"><span class="ion-sidebar__icon"><i data-lucide="package"></i></span><span class="ion-sidebar__label">Inventory</span></button></li>
                <li><button class="ion-sidebar__item" type="button" data-tab="Desk book"><span class="ion-sidebar__icon"><i data-lucide="messages-square"></i></span><span class="ion-sidebar__label">Desk book</span></button></li>
              </ul>
            </div>
            <div class="ion-sidebar__group">
              <div class="ion-sidebar__group-label">Product Engineer practical</div>
              <ul class="ion-sidebar__menu">
                <li><button class="ion-sidebar__item" type="button" data-tab="Candidate brief"><span class="ion-sidebar__icon"><i data-lucide="file-text"></i></span><span class="ion-sidebar__label">Candidate brief</span></button></li>
              </ul>
            </div>
          </nav>
          <div class="ion-sidebar__footer cs-sidefoot" data-tour="replay">
            <ul class="ion-sidebar__menu">
              <li><button class="cs-sideaction" type="button" data-action="tour"><span class="ion-sidebar__icon"><i data-lucide="route"></i></span><span class="ion-sidebar__label">Walkthrough</span></button></li>
              <li><button class="cs-sideaction" type="button" data-action="restart"><span class="ion-sidebar__icon"><i data-lucide="rotate-ccw"></i></span><span class="ion-sidebar__label">Restart sample shift</span></button></li>
            </ul>
          </div>
        </div>
      </aside>

      <div class="ion-shell__inset">
        <header class="ion-shell__header ion-shell__header--sticky">
          <button class="ion-shell__trigger" type="button" data-sidebar-trigger aria-label="Toggle sidebar"><i data-lucide="panel-left"></i></button>
          <span class="ion-shell__divider"></span>
          <p class="ion-shell__title" data-sidebar-title>Requests</p>
          <div class="ion-shell__end">
            <span class="cs-clock"><span class="t-label t-muted">Desk time</span><strong data-clock></strong></span>
            <button type="button" class="ion-btn ion-btn--sm ion-btn--blue" data-action="advance" data-tour="advance"><span class="cs-wide" data-advance-label></span><span class="cs-narrow">Next</span><i data-lucide="arrow-right"></i></button>
            <button data-theme-toggle data-size="sm"></button>
          </div>
        </header>
        <main class="cs-main">
          <div class="cs-notice">
            <span role="status" aria-live="polite" data-status></span>
            <button type="button" class="ion-btn ion-btn--sm ion-btn--ghost" data-action="undo" hidden>Undo</button>
          </div>
          <div data-confirm></div>
          <div class="cs-stack" data-page aria-label="Selected register"></div>
        </main>
      </div>

      <dialog class="cs-modal" data-modal aria-labelledby="cs-modal-title"></dialog>

      <div class="cs-tour" data-tour-layer hidden>
        <div class="cs-tour__spot" aria-hidden="true"></div>
        <div class="cs-tour__card" role="dialog" aria-modal="true" aria-labelledby="cs-tour-title" tabindex="-1" data-tour-card></div>
      </div>
    </div>

    <script src="./third-party/lucide.min.js"></script>
    <script>lucide.createIcons();</script>
    <script src="./ion/ion.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
